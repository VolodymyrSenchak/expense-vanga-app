<h2 mat-dialog-title>User profile</h2>
<mat-dialog-content class="ev-dialog-narrow">
  <div class="ev-form">
    <div>
      <div class="ev-small ev-muted">User email</div>
      <div>{{user()?.email}}</div>
    </div>

    <div class="ev-form-actions">
      <button mat-stroked-button type="button" (click)="changePassword()">Change password</button>
      <button mat-button (click)="onLogout()">Logout</button>
    </div>
  </div>
</mat-dialog-content>
