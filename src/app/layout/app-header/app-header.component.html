<header class="app-header">
  <div class="header-inner">
    <a routerLink="/" class="brand">
      <img src="images/logo_new.png" alt="" height="32" width="32">
      <span class="brand-name">Expense Vanga</span>
    </a>

    <nav aria-label="Main" class="desktop-nav">
      @for (page of pages; track page.url) {
        <a mat-button routerLink="{{ page.url }}" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
           ariaCurrentWhenActive="page">{{ page.name }}</a>
      }
    </nav>

    <div class="desktop-actions">
      <button mat-icon-button class="ev-icon-outlined" (click)="themeService.toggle()"
              [attr.aria-label]="themeService.isDark() ? 'Switch to light theme' : 'Switch to dark theme'">
        <mat-icon>{{ themeService.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
      <app-user-profile />
    </div>

    <button mat-icon-button class="ev-icon-outlined phone-account" [matMenuTriggerFor]="accountMenu"
            aria-label="Account and settings">
      @if (userInitials()) {
        <span class="initials">{{ userInitials() }}</span>
      } @else {
        <mat-icon>person</mat-icon>
      }
    </button>
    <mat-menu #accountMenu="matMenu" xPosition="before">
      <button mat-menu-item (click)="themeService.toggle()">
        <mat-icon>{{ themeService.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
        {{ themeService.isDark() ? 'Light theme' : 'Dark theme' }}
      </button>
      @if (userInitials()) {
        <button mat-menu-item (click)="openUserProfile()">
          <mat-icon>person</mat-icon>
          Profile
        </button>
      } @else {
        <button mat-menu-item (click)="openAuthDialog()">
          <mat-icon>login</mat-icon>
          Log in
        </button>
      }
    </mat-menu>
  </div>
</header>

<nav aria-label="Main" class="bottom-nav">
  @for (page of pages; track page.url) {
    <a routerLink="{{ page.url }}" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
       ariaCurrentWhenActive="page" matRipple>
      <mat-icon aria-hidden="true">{{ page.icon }}</mat-icon>
      <span>{{ page.name }}</span>
    </a>
  }
</nav>
