<app-expenses-details-header class="card-head" [viewMode]="viewMode()" (viewModeChanged)="viewModeChanged.emit($event)" />
@if (!currentExpenses()) {
  <div class="skeleton">
    <app-loading [loadingOptions]="{ isLoading: true, message: '' }" mode="skeleton" [skeletonBody]="skeleton" />
  </div>
} @else {
  <div class="scroller">
    <div class="calendar-grid">
      @for (expense of currentExpensesPrepared(); track $index) {
        <div
          class="cell"
          [class.weekend]="expense.isWeekend"
          [class.previous-day]="expense.isPreviousDay"
          [class.today]="expense.isToday"
          [class.autogenerated]="expense.autogenerated"
          [attr.tabindex]="expense.expense ? 0 : null"
          [attr.role]="expense.expense ? 'button' : null"
          (click)="expense.expense && startEditing(expense.expense)"
          (keydown.enter)="expense.expense && startEditing(expense.expense)"
        >
          <div class="month-day">
            <span class="weekday-label">{{ expense.weekdayShort }}</span> {{ expense.monthDay }}
          </div>
          @if (expense.expense) {
            <div class="cell-amounts">
              <div class="amount-row expected-row">
                <span class="row-label">Exp</span>
                <ev-amount [value]="expense.expense.expectedExpenseAmount" kind="expected" format="spend" />
              </div>
              <div class="amount-row"
                   [class.ev-over]="expense.expense.actualExpenseAmount > expense.expense.expectedExpenseAmount"
                   [class.ev-under]="expense.expense.actualExpenseAmount < expense.expense.expectedExpenseAmount">
                <span class="row-label">Act</span>
                <ev-amount [value]="expense.expense.actualExpenseAmount" format="spend" />
              </div>
              <div class="left-row"><ev-amount [value]="expense.expense.actualAmountLeft" [strong]="true" /></div>
              @if (expense.expense.actualDailyComment) {
                <div class="comment">{{ expense.expense.actualDailyComment }}</div>
              }
            </div>
          }
        </div>
      }
    </div>
  </div>
}
