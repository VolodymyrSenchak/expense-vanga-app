<main class="ev-page">
  @if (isMobile()) {
    <app-expenses-inline-list />
  } @else {
    <ev-page-header [title]="title()" [subtitle]="subtitle()">
      <app-actualize-expenses-button />
    </ev-page-header>

    <div class="overview">
      <mat-card class="hero" aria-label="Projected balance">
        <app-month-analytics [monthAnalytics]="monthAnalytics()" [currency]="currency()" [endLabel]="cycle()?.end" />
        <app-expenses-chart />
      </mat-card>

      <div class="side">
        @if (today(); as today) {
          <app-today-card [today]="today" />
        }
        <app-spent-card [spentSoFar]="spentSoFar()" />
      </div>
    </div>

    <mat-card class="ev-card-flush" aria-label="Day by day">
      @switch (viewMode()) {
        @case ('calendar') { <app-expenses-calendar [viewMode]="viewMode()" (viewModeChanged)="changeViewMode($event)" /> }
        @default { <app-expenses-list [viewMode]="viewMode()" (viewModeChanged)="changeViewMode($event)" /> }
      }
    </mat-card>
  }
</main>
