<mat-card>
  <div class="head">
    <h2 class="ev-h3">Today</h2>
    <span class="ev-small ev-muted">{{ dateLabel() }}</span>
  </div>

  <div class="planned">
    <div class="ev-small ev-muted">Spent</div>
    <ev-amount class="planned-value" [value]="today().actualExpenseAmount" format="spend" [class.ev-over]="difference() > 0" [class.ev-under]="difference() < 0"/>
    @if (difference() !== 0) {
      <div class="spent ev-small ev-muted">
        <div>Planned to spend: <ev-amount [value]="today().expectedExpenseAmount" kind="expected" format="spend" /></div>
        <div>
          Difference:
          <span class="ev-num" [class.ev-over]="difference() > 0" [class.ev-under]="difference() < 0">
            {{ difference() > 0 ? '+' : '−' }}{{ absDifference() | number:'1.2-2' }}
          </span>
        </div>
      </div>
    }
  </div>

  <div class="left">
    <div class="ev-small ev-muted">Left after today</div>
    <ev-amount-pair [expected]="today().expectedAmountLeft" [actual]="today().actualAmountLeft" />
  </div>

  @if (showAction()) {
    <app-actualize-expenses-button class="action" />
  }
</mat-card>
