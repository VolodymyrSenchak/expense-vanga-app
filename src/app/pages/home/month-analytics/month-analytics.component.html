<div class="caption ev-muted">Left on {{ endLabel() }}</div>
<div class="stats">
  <ev-stat
    [label]="compact() ? 'Actual' : 'Actual · how it is going'"
    kind="actual"
    [size]="compact() ? 'compact' : 'hero'"
    [value]="monthAnalytics().actualAmountLeft"
    [currency]="compact() ? undefined : currency()"
  />
  <ev-stat
    [label]="compact() ? 'Expected' : 'Expected · your plan'"
    kind="expected"
    [size]="compact() ? 'compact' : 'hero-2'"
    [value]="monthAnalytics().expectedAmountLeft"
    [currency]="compact() ? undefined : currency()"
  />
</div>
<ev-diff-chip [diff]="monthAnalytics().diff" [currency]="currency()" />
