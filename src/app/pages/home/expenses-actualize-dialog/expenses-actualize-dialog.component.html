<h2 mat-dialog-title>Update balances</h2>
<mat-dialog-content>
  @if (loadingSrv.loadingOptions().isLoading) {
    <app-loading
      [loadingOptions]="loadingSrv.loadingOptions()"
      [mode]="'spinner'"
    />
  } @else {
    <form class="ev-form balances-form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <p class="ev-muted intro">
        Enter how much money you have right now. The difference from the forecast becomes today's actual spending.
      </p>
      <div formArrayName="money" class="ev-form">
        @for (expense of form.controls.money.controls; track $index) {
          <div [formGroupName]="$index" class="ev-form-row">
            <mat-form-field class="name">
              <mat-label>Name</mat-label>
              <input matInput type="text" formControlName="name">
            </mat-form-field>

            <mat-form-field class="amount">
              <mat-label>Amount</mat-label>
              <input matInput class="ev-num" step="10" type="number" formControlName="amount">
            </mat-form-field>

            <mat-form-field class="currency">
              <mat-label>Currency</mat-label>
              <input matInput type="text" formControlName="currency" [matAutocomplete]="currencies.panel()">
            </mat-form-field>
            <ev-currency-autocomplete #currencies />

            <button mat-icon-button type="button" class="remove" (click)="removeMoneyPart($index)" aria-label="Remove">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        }
        <div>
          <button mat-stroked-button type="button" (click)="addMoneyPart()">
            <mat-icon>add</mat-icon>
            Add more
          </button>
        </div>
      </div>

      <div class="ev-form-actions actions">
        <button mat-button type="button" (click)="onCancel()">Cancel</button>
        <button mat-flat-button type="submit" [disabled]="form.invalid">Save</button>
      </div>
    </form>
  }
</mat-dialog-content>
