@if (!hasTransactions()) {
  <div class="empty ev-muted">No transactions yet</div>
} @else {
  <div class="toolbar">
    <mat-button-toggle-group [value]="chartMode()" (change)="chartMode.set($event.value)" aria-label="Chart">
      <mat-button-toggle value="cumulative">Running total</mat-button-toggle>
      <mat-button-toggle value="monthly">Per month</mat-button-toggle>
    </mat-button-toggle-group>
  </div>
  @if (chartMode() === 'cumulative') {
    <canvas baseChart
      [data]="chartData()"
      [options]="chartOptions()"
      [type]="'line'"
      [legend]="true">
    </canvas>
  } @else {
    <canvas baseChart
      [data]="monthlyChartData()"
      [options]="monthlyChartOptions()"
      [type]="'bar'"
      [legend]="true">
    </canvas>
  }
}
