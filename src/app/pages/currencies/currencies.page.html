<div class="ev-page">
  <form [formGroup]="form" (ngSubmit)="submitForm()" class="ev-stack">
    <ev-page-header title="Currencies" subtitle="Your main currency and the rates used to convert other currencies into it.">
      <button mat-flat-button type="submit" [disabled]="form.invalid">Save changes</button>
    </ev-page-header>

    @if (loadingSrv.loadingOptions().isLoading) {
      <app-loading
        [loadingOptions]="loadingSrv.loadingOptions()"
        [mode]="'skeleton'"
        [skeletonBody]="[['100%', '300px']]"
      />
    } @else {
      <mat-card class="currencies-card" aria-label="Currencies">
        <div>
          <h2 class="ev-h2">Main currency</h2>
          <p class="ev-muted card-text">Forecast and savings totals are shown in this currency.</p>
        </div>
        <mat-form-field class="default-currency">
          <mat-label>Default currency</mat-label>
          <input matInput type="text" formControlName="defaultCurrency">
        </mat-form-field>

        <div>
          <h2 class="ev-h2">Exchange rates</h2>
          <p class="ev-muted card-text">1 unit of "From" equals "Rate" units of "To".</p>
        </div>
        <div formArrayName="currencies" class="rates">
          @for (expense of form.controls.currencies.controls; track $index) {
            <div [formGroupName]="$index" class="rate-row">
              <mat-form-field>
                <mat-label>From</mat-label>
                <input matInput type="text" formControlName="from">
              </mat-form-field>

              <mat-form-field>
                <mat-label>To</mat-label>
                <input matInput type="text" formControlName="to">
              </mat-form-field>

              <mat-form-field>
                <mat-label>Rate</mat-label>
                <input matInput class="ev-num" type="number" formControlName="rate">
              </mat-form-field>

              <button mat-icon-button type="button" class="remove" (click)="removeCurrency($index)" aria-label="Remove rate">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          }
        </div>

        <div>
          <button mat-stroked-button type="button" (click)="addCurrency()">
            <mat-icon>add</mat-icon>
            Add rate
          </button>
        </div>
      </mat-card>
    }
  </form>
</div>
